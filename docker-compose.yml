services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kisansetu
      POSTGRES_USER: kisansetu
      POSTGRES_PASSWORD: kisansetu-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kisansetu -d kisansetu"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://kisansetu:kisansetu-local-only@db:5432/kisansetu
      CORS_ORIGINS: http://localhost:8081,http://localhost:19006
      OPERATOR_ACCESS_TOKEN: local-operator
      AUTH_SECRET_KEY: development-only-change-me
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic -c backend/alembic.ini upgrade head &&
      uvicorn backend.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

volumes:
  postgres_data:
